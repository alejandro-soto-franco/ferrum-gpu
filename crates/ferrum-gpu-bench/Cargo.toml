[package]
name = "ferrum-gpu-bench"
version.workspace = true
edition.workspace = true
publish = false

[dependencies]
anyhow = "1"
bytemuck = { workspace = true }
cuda-core = { workspace = true }
cuda-device = { workspace = true }
cuda-host = { workspace = true }
cudarc = { version = "0.19", default-features = false, features = ["std", "driver", "cufft", "nvrtc", "cuda-13010", "dynamic-loading"] }
ferrum-gpu-fft = { workspace = true }

[lib]
name = "ferrum_gpu_bench"
path = "src/lib.rs"

[[bin]]
name = "ferrum-gpu-bench"
path = "src/main.rs"

[[bin]]
name = "perf-gate"
path = "src/bin/perf-gate.rs"

[[bin]]
name = "kernel-cross-check"
path = "src/bin/kernel-cross-check.rs"

[[bin]]
name = "cufft-ncu-trace"
path = "src/bin/cufft-ncu-trace.rs"

[[bin]]
name = "cusimd-ptx-dump"
path = "src/bin/cusimd-ptx-dump.rs"

[[bin]]
name = "radix8-regreport"
path = "src/bin/radix8-regreport.rs"

[[bin]]
name = "launch-overhead-microbench"
path = "src/bin/launch-overhead-microbench.rs"

[[bin]]
name = "smem-bank-conflict-probe"
path = "src/bin/smem-bank-conflict-probe.rs"

[lints]
workspace = true
