[build-system]
requires = ["maturin>=1.7,<2"]
build-backend = "maturin"

[project]
name = "ferrum-gpu"
version = "0.1.0"
description = "Pure-Rust GPU compute substrate with Python bindings. cuda-oxide-compiled Stockham FFT."
readme = "../../README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
authors = [{ name = "Alejandro Soto Franco", email = "sotofranco.eng@gmail.com" }]
keywords = ["gpu", "cuda", "fft", "scientific-computing", "rust", "cuda-oxide"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: GPU :: NVIDIA CUDA :: 13",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: Apache Software License",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Rust",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Scientific/Engineering",
  "Topic :: Scientific/Engineering :: Mathematics",
]
dependencies = ["numpy>=1.24"]

[project.urls]
Repository = "https://github.com/alejandro-soto-franco/ferrum-gpu"
Issues = "https://github.com/alejandro-soto-franco/ferrum-gpu/issues"

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.maturin]
features = ["pyo3/extension-module"]
module-name = "ferrum_gpu._native"
python-source = "python"
