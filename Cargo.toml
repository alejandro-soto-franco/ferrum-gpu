[workspace]
resolver = "3"
members = [
    "crates/ferrum-gpu-core",
    "crates/ferrum-gpu-cuda",
    "crates/ferrum-gpu",
    "examples/vector-add",
    "kernels/ferrum-gpu-kernels",
]

[workspace.package]
version = "0.0.1"
edition = "2024"
rust-version = "1.85"
authors = ["Alejandro Soto Franco <sotofranco.eng@gmail.com>"]
license = "Apache-2.0"
repository = "https://github.com/alejandro-soto-franco/ferrum-gpu"
homepage = "https://github.com/alejandro-soto-franco/ferrum-gpu"
documentation = "https://docs.rs/ferrum-gpu"

[workspace.dependencies]
ferrum-gpu-core = { version = "0.0.1", path = "crates/ferrum-gpu-core" }
ferrum-gpu-cuda = { version = "0.0.1", path = "crates/ferrum-gpu-cuda" }
ferrum-gpu = { version = "0.0.1", path = "crates/ferrum-gpu" }

bytemuck = { version = "1", features = ["derive"] }
cudarc = { version = "0.19", default-features = false, features = ["std", "driver", "nvrtc", "cuda-13010", "dynamic-loading"] }
log = "0.4"
parking_lot = "0.12"
serde = { version = "1", default-features = false, features = ["derive"] }
serde_json = "1"
thiserror = { version = "2", default-features = false, features = ["std"] }

# cuda-oxide ecosystem (pinned to a specific main rev). Plan 2 integration.
cuda-device = { git = "https://github.com/NVlabs/cuda-oxide.git", rev = "6ed9938e73a1e036dfab13f6e9a4585a170d03cf" }
cuda-core   = { git = "https://github.com/NVlabs/cuda-oxide.git", rev = "6ed9938e73a1e036dfab13f6e9a4585a170d03cf" }
cuda-host   = { git = "https://github.com/NVlabs/cuda-oxide.git", rev = "6ed9938e73a1e036dfab13f6e9a4585a170d03cf" }
cuda-macros = { git = "https://github.com/NVlabs/cuda-oxide.git", rev = "6ed9938e73a1e036dfab13f6e9a4585a170d03cf" }

[workspace.lints.rust]
missing_docs = "warn"
unsafe_op_in_unsafe_fn = "warn"
unreachable_pub = "warn"

[workspace.lints.clippy]
undocumented_unsafe_blocks = "warn"
missing_safety_doc = "warn"
ptr_as_ptr = "warn"
ref_as_ptr = "warn"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 4
